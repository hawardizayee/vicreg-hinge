# Image JEPA (VICReg) Training Configuration
# Train a self-supervised image representation model on CIFAR-10 or CIFAR-100

meta:
  seed: 42
  device: auto # auto,cuda or cpu 

data:
  dataset: cifar10  # cifar10 or cifar100
  batch_size: 256
  num_workers: 8 

model:
  #backbone 
  type: resnet      # resnet, vit_s, vit_b
  patch_size: 2     # For ViT only 

  # Projector 
  use_projector: true 
  proj_hidden_dim: 1024
  proj_output_dim: 1024 

loss:
  type: vicreg    # only used in the run name
  # VICReg variance term: hinge on the std (VICReg default) or on the variance
  hinge: std        # std or var
  hinge_coeff: 1.0  # weight mu of the variance term (the swept variable)
  cov_coeff: 100.0
  eps: 1.0e-4       # constant inside the std hinge's sqrt (VICReg default); unused by the var hinge

optim:
  epochs: 300 
  lr: 0.3 
  weight_decay: 1.0e-4 
  warmup_epochs: 10 
  warmup_start_lr: 3.0e-5
  min_lr: 0.0 


logging:
  log_wandb: true 
  wandb_group: cifar10   
  log_every: 10       # Log every N epochs
  save_every: 50      # Save checkpoint every N epochs 
  tqdm_silent: false  # Disable tqdm progress bars
  save_embeddings: true  # Per-epoch monitor-batch embeddings (~0.9 GB); needed for Figs 3-5

training:
  use_amp: true     # use automatic mixed precision
  dtype: bfloat16   # float16 or bfloat16
