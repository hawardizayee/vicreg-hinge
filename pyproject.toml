[project]
name = "vicreg-hinge"
version = "0.1.0"
description = "VICReg with a standard-deviation or variance hinge, on CIFAR-10 / CIFAR-100"
dependencies = [
    "fire>=0.7.0",
    "numpy",
    "omegaconf",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm",
    "wandb>=0.21.1",
]
requires-python = "==3.12.*"

# CUDA 12.8 wheels: covers sm_70..sm_120 (V100 through Blackwell). Needs driver >= 570.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Scripts only, nothing to build or install as a package
[tool.uv]
package = false

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
]
